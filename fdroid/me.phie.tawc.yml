# DRAFT F-Droid build recipe — belongs in a fork of
# https://gitlab.com/fdroid/fdroiddata as metadata/me.phie.tawc.yml.
# It lives here so it can be reviewed and revised alongside the code it
# builds; nothing in this repo reads it.
#
# Status: TESTED. `fdroid build --verbose --test --refresh-scanner
# --on-server --no-tarball me.phie.tawc:1` builds a release APK in
# registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie — F-Droid's
# own buildserver image, driven the way fdroiddata's CI drives it. The
# host-package list below is what that build actually needed, from an
# image with none of it preinstalled.
#
# Before submitting, run `fdroid rewritemeta me.phie.tawc` in the
# fdroiddata fork: their CI enforces canonical formatting, which sorts
# `Categories`, reorders the build fields, and strips every comment in
# this file. The commentary is for us, not for them.
#
# This file names the app version in five places, and must be re-synced
# with app/build.gradle.kts on every version bump for as long as it lives
# here — `scripts/check-version-sync.sh` enforces that, and
# notes/release.md's prep steps run it. Once the recipe is merged into
# fdroiddata, delete this copy: from then on the recipe lives upstream and
# AutoUpdateMode keeps its version fields current from the `vN` tags, so a
# copy here could only ever go stale.

Categories:
  - System
  - Development
License: GPL-3.0-only
SourceCode: https://github.com/wmww/tawc
IssueTracker: https://github.com/wmww/tawc/issues
AuthorName: Sophie Winter

RepoType: git
Repo: https://github.com/wmww/tawc.git

Builds:
  - versionName: '2'
    versionCode: 2
    commit: v2
    subdir: app
    ndk: 27.2.12479018

    # Host packages for the cross-builds the Gradle build drives:
    # libhybris (aarch64 glibc cross-toolchain, autotools, wayland-scanner)
    # and Xwayland plus its ~22 dependencies (meson/ninja, autotools,
    # xsltproc, python3-libxml2). Rust comes from Debian's rustup package;
    # if the buildserver image predates it, swap in rustup-init:
    #   curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/r.sh
    #   RUSTUP_HOME=/opt/rustup CARGO_HOME=/opt/cargo sh /tmp/r.sh -y \
    #     --no-modify-path --profile minimal --default-toolchain none
    sudo:
      - apt-get update
      - apt-get install -y
          rustup
          build-essential make pkg-config curl libarchive-tools file
          meson ninja-build bison
          autoconf automake libtool libtool-bin libltdl-dev
          perl python3 python3-libxml2 xsltproc libexpat1-dev
          libwayland-dev libwayland-bin libwayland-egl-backend-dev
          wayland-protocols
          libvulkan-dev patchelf
          libx11-dev libx11-xcb-dev libxcb1-dev
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          binutils-aarch64-linux-gnu libc6-arm64-cross
          linux-libc-dev-arm64-cross

    # Script entries are joined with `&&`, so the leading `cd` applies to
    # everything after it — the recipe does not depend on which directory
    # fdroidserver starts prebuild in.
    #
    # rust-toolchain.toml at the repo root pins the compiler version and
    # every target, so rustup installs exactly what the upstream build
    # uses without the recipe naming a version. cargo-ndk is a cargo
    # subcommand and cannot be pinned there; its version is recorded in
    # notes/building.md.
    #
    # Gradle properties go into gradle.properties rather than the
    # `gradleprops:` field because one of the values contains a comma,
    # which that field uses as its own separator:
    #   tawcMethods=tawcroot   only the tawcroot exec backend (skips the
    #                          proot build and its talloc tarball)
    #   tawcGraphics=...       libhybris is the production GPU path; cpu is
    #                          the software fallback. Both are built from
    #                          source. Omitting gfxstream/libhybris-zink
    #                          skips the Mesa build, which is the only part
    #                          of the tree that would download prebuilt
    #                          distro packages.
    #
    # settings.gradle.kts clones the pinned termux-app checkout at
    # settings-evaluation time (the in-app terminal widget is built from
    # it); doing it here instead keeps the fetch in the phase where
    # fetching is expected. Every other pinned dep in deps/deps.list is
    # cloned on demand by the build script that needs it — only the ones
    # this configuration actually uses.
    #
    # cargo-ndk lands in $CARGO_HOME/bin and the Gradle step runs in a
    # fresh process, but ~/.cargo/bin is on the build user's PATH on the
    # buildserver, so `cargo ndk` resolves and the `gradle:` field below
    # works as-is — no explicit `build:` override needed.
    prebuild:
      - cd "$(git rev-parse --show-toplevel)"
      - printf 'tawcMethods=tawcroot\ntawcGraphics=libhybris,cpu\n' >> gradle.properties
      - cargo install cargo-ndk --version 4.1.2 --locked
      - scripts/ensure-deps.sh termux-app

    # No scanignore/scandelete: the scanner reports nothing. It runs
    # after prebuild, when deps/termux-app is the only checkout on disk —
    # every other dep is cloned later by the Gradle build, so the scanner
    # never sees those trees. It deletes the gradle wrappers it finds
    # (ours and termux-app's) plus gradle/gradle-daemon-jvm.properties,
    # which is expected: fdroidserver builds with its own verified Gradle
    # via gradlew-fdroid. Dropping the daemon-JVM pin means the build
    # takes whatever JDK the buildserver defaults to — currently 21, which
    # is what this build needs.
    gradle:
      - yes

# Plain `Version`: checkupdates writes the tag it matched below into a new
# Builds entry, so the `v` prefix comes from the tag itself. The older
# `Version v%v` spelling no longer validates against fdroiddata's schema.
AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+$
CurrentVersion: '2'
CurrentVersionCode: 2
