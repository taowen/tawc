[package]
name = "tawc-integration-tests"
version = "0.1.0"
edition = "2021"
autotests = false

[dependencies]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(tawc_skip_gfxstream_on_target)',
    'cfg(tawc_skip_libhybris_on_target)',
    'cfg(tawc_skip_root_on_target)',
    'cfg(tawc_live_relay)',
    'cfg(tawc_export_tests)',
    'cfg(tawc_export_peer)',
] }

[lib]
name = "tawc_integration"
path = "src/lib.rs"
test = false
doctest = false

# One test binary; `tests/integration.rs` declares per-group submodules.
# Test names are `<module>::test_…`, so libtest's normal substring filter
# (e.g. `cargo test <module>::`) picks a subset.
[[test]]
name = "integration"
path = "tests/integration.rs"

# Cold-compositor invariants. Its own binary with `test = false`: plain
# `cargo test` must not run it, because it only holds before anything has
# opened a window. `scripts/run-integration-tests.sh` runs it explicitly
# (`cargo test --test cold_start`) at that point.
[[test]]
name = "cold_start"
path = "tests/cold_start.rs"
test = false

[[bin]]
name = "tawc-exec"
path = "src/bin/tawc-exec.rs"
